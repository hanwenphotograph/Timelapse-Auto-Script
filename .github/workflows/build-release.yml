name: Build release packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag, branch, or commit to build
        required: true
        type: string
      version:
        description: Version used in archive names, without a leading v
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            runner: ubuntu-22.04
            suffix: linux-x64
          - platform: Windows x64
            runner: windows-2022
            suffix: windows-x64
          - platform: macOS Intel
            runner: macos-15-intel
            suffix: macos-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

      - name: Build portable package
        run: python scripts/build_release.py

      - name: Stage release archive
        shell: bash
        run: |
          mkdir artifacts
          archive="$(find bin/Release-Archives -type f -name '*.zip' -print -quit)"
          cp "$archive" "artifacts/TimelapseManager-${{ inputs.version }}-${{ matrix.suffix }}-portable.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: TimelapseManager-${{ matrix.suffix }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 7
